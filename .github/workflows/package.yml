name: package

# The device repository's copy of the packaging action (docs/porting/packaging.md).
# scripts/package.sh runs on a macOS runner with the UniXNU and uefi-bluejay
# checkouts beside it. The platform seed comes from the repository secret
# UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so a run's artifacts belong
# to one device alone: download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["17"]
        default: "17"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          # The GS101/Pixel 6a platform package; the firmware preflight installs
          # bluejayPkg and GS101Pkg into the Mu-Silicium checkout below.
          repository: tuxmanxd/uefi-bluejay
          path: uefi-bluejay
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: Project-Silicium/Mu-Silicium
          path: mu
          submodules: false
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools blacktop/tap/ipsw
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: firmware overlay
        # The firmware step reads mu/Resources/Configs/bluejay.toml before its
        # [firmware] preflight runs, so the overlay has to be installed first.
        env:
          UNIXNU_UEFI: ${{ github.workspace }}/mu
        run: python3 device/scripts/uefi-apply.py
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/package.sh --os "${{ inputs.os }}" --uefi ../mu
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/bluejay/*/*/boot/boot.img
            UniXNU/out/bluejay/*/*/payload/payload.img
            UniXNU/out/bluejay/*/*/kernel/kernel.macho
            UniXNU/out/bluejay/*/*/package.manifest.json
