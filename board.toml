schema_version = 2

[board]
name = "bluejay"
soc = "GS101"
soc_source = "gs101"
os_profile = "ipados-17.7.11-21H461"
description = "Google Pixel 6a (Tensor G1)"
kit = "bluejay"

[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "GopFramebuffer"]

[userdata]
# GPT entry "userdata" on UFS LUN 0: first=0x22F1E6 last=0x1DC03FA, 4096-byte LBAs.
# 28906005 blocks = 110.2 GiB (the XNU log prints 112914 MiB).
first_lba = 2290150
last_lba = 31130618
lba_bytes = 4096

[kernel]
defconfig = "bluejay_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/gs101.config", "os:configs/ipados.config"]
patch_series = [
  "arch:patches/xnu/series",
  "soc:patches/xnu/series",
  # Replaces os:patches/xnu/series: same three entries, with the boot-progress
  # patch taken from the device copy that drops the Qualcomm-only hunk.
  "device:patches/xnu/series",
]
# arch profile order. CONFIG_XNU_SOURCE_MOCKFS comes from the os fragment, so
# vfs_conf.o references the mockfs fixture and the final link needs it.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
  "build-mockfs-fixture.py",
]

[device_tree]
source = "device:dts/bluejay.dts"
include_dirs = ["soc:dts"]

[firmware]
# Built from tuxmanxd/uefi-bluejay (Mu-Silicium platform for bluejay/GS101).
# scripts/uefi-apply.py installs bluejayPkg, GS101Pkg and the FD config into
# the Mu-Silicium checkout named by --uefi before the EDK II build runs.
# --uefi must be a Mu-Silicium checkout (for example Project-Silicium/Mu-Silicium).
config = "bluejay"
dsc = "Platforms/Google/bluejayPkg/bluejay.dsc"
fd = "Build/bluejayPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Binaries", "Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
# darwinboot-debug.py is TEMPORARY: it makes a failed xnu boot draw its stage
# and status on the panel instead of returning to the menu, which repaints.
preflight = ["scripts/uefi-apply.py", "scripts/build-boot-dtb.py", "scripts/darwinboot-debug.py"]
packages = [
  "{uefi}",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Platforms/Google",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Google",
  "{uefi}/Silicon/Samsung",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Samsung",
  "{uefi}/Silicium-ACPI/Silicon/Samsung",
]

[firmware.defines]
DEVICE_MODEL = "bluejay"
# Add UniXNU.inf, UniXNUDxe.inf, UniXNURamDiskDxe.inf and DarwinBoot.inf.
UNIXNU_PAYLOAD = 1

[bootimg]
dtb = "build/bluejay/bluejay.dtb"

[bootimg.image]
# Same layout as the firmware-only image measured booting on this phone
# (docs/EVIDENCE.md in uefi-bluejay): Android header v4, uncompressed shim plus
# FD. The pixelios shim is loaded with v0, but v4 is the layout verified here.
base = 0
kernel_offset = 0x8000
tags_offset = 0x100
pagesize = 4096
header_version = 4
kernel_compression = "none"

[payload]
volume = "BLUEJAY"
# The volume travels in the boot image kernel field (shim + FD + envelope +
# volume), not in the ramdisk: Tensor ABL caps the ramdisk at 32 MiB and the
# kernel alone is 49.5 MiB. 54 MiB holds the kernel and leaves ~3.7 MiB free;
# the kernel field is then ~56.1 MiB, under the measured 64 MiB boot_a.
size_mib = 54
loader = "firmware"
title = "UniXNU"
dram_size = "0xf0000000"
# Temporary bring-up probe (scripts/patch-xnu-entry-probe.py in UniXNU):
# paint band 1 at kernel entry, band 2 before the MMU enable, then wait this
# many seconds and reset through PSCI. On the phone the first two bands are
# visible (green DarwinBoot, blue entry, magenta before SCTLR_EL1), so the
# question this answers is whether the CPU survives the MMU enable: a reboot
# after ~8 s means yes, no reboot means it faults at/just after it. Remove
# this key (and panic_screen) once the boot path is stable.
entry_probe_reset_delay = 8
# The panic screen (0xa1f bytes) is placed right after the last probe cave and
# would run 0xaf bytes past the padding end at 0xfffffff0073f0ff0 when stage 3
# is installed, so the tool refuses. Keep it off while a reset probe is active;
# turn it back on once the probes are removed.
panic_screen = false
timeout = 3
kernel_args = ["-v", "serial=3", "debug=0x14e", "keepsyms=1"]

[payload.adt]
# 0x8015 is the Apple chip id the pixelios ADT emitter uses for this port
# (tools/mkadt.py: chip-id). It is an XNU platform identity, not the GS101 id.
chip_id = "8015"
owned_memory_size = "0xf0000000"
unique_chip_id = "required"
packed_data_ramdisk = true
psci_method = "smc"

[adt.defaults.u32]
# No Apple PMGR or SEP is present: report a virtual platform so AMFI does not
# wait for an ApplePMGRNub.
"vmm-present" = 1

[adt.chosen.u32]
# GS101 has no CTRR: kernel text stays writable by hardware.
"kernel-ctrr-to-be-enabled" = 0

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[package]
unixnu = "../UniXNU"
# fastboot getvar partition-size:boot_a = 0x4000000. The kernel field carries
# the payload volume, so the whole image is ~56.1 MiB; verify refuses growth.
boot_partition_bytes = 67108864

[package.defconfig]
"ipados-17.7.11-21H461" = "bluejay_defconfig"
